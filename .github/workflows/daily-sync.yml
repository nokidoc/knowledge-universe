name: Daily Data Sync

on:
  schedule:
    - cron: '0 4 * * *'  # 4:00 UTC = 6:00 CEST täglich
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install axios
      
      - name: Fetch data and update HTML
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_API_KEY: ${{ secrets.SHEET_API_KEY }}
        run: |
          node - << 'EOFJS'
          const axios = require('axios');
          const fs = require('fs');
          
          const SHEET_ID = '1R8m841BAAqUsmcH6taujbyh_0oj19PlaAGCpvQgCYMM';
          const API_KEY = process.env.SHEET_API_KEY || 'AIzaSyAO7lWlnGCe0eZLiQj_l6osfYPR1gPWYGo';
          
          async function fetchData() {
            try {
              const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Archiv?key=${API_KEY}`;
              const response = await axios.get(url);
              const rows = response.data.values || [];
              
              if (rows.length < 2) {
                console.log('No data in sheet');
                return [];
              }
              
              const headers = rows[0];
              const entries = rows.slice(1).map(row => ({
                datum: row[headers.indexOf('Datum')] || '',
                url: row[headers.indexOf('URL')] || '',
                plattform: row[headers.indexOf('Plattform')] || 'TikTok',
                autor: row[headers.indexOf('Autor')] || '',
                titel: row[headers.indexOf('Titel')] || '',
                hashtags: (row[headers.indexOf('Hashtags')] || '').split(',').map(h => h.trim()).filter(h => h),
                transkript: row[headers.indexOf('Transkript')] || '',
                zusammenfassung: row[headers.indexOf('Zusammenfassung')] || '',
                bild_url: row[headers.indexOf('Bild_URL')] || 'https://drive.google.com/uc?id=1uviY12BHSFPlkBkQK8WMXqFb_IuBkXtV',
                relevanz: parseInt(row[headers.indexOf('Relevanz')] || '5'),
                views: parseInt((row[headers.indexOf('Views')] || '0').toString().replace(/[^0-9]/g, '')) || 0,
                likes: parseInt((row[headers.indexOf('Likes')] || '0').toString().replace(/[^0-9]/g, '')) || 0,
                cluster: row[headers.indexOf('Cluster')] || 'Claude'
              }));
              
              return entries;
            } catch (err) {
              console.error('Error fetching data:', err.message);
              return [];
            }
          }
          
          async function updateHTML() {
            const entries = await fetchData();
            if (entries.length === 0) return;
            
            let html = fs.readFileSync('index.html', 'utf8');
            const dataScript = `let DATA = ${JSON.stringify({entries})};`;
            html = html.replace(/let DATA = \{[\s\S]*?\};/, dataScript);
            fs.writeFileSync('index.html', html);
            console.log(`Updated with ${entries.length} entries`);
          }
          
          updateHTML();
          EOFJS
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git commit -m "Auto-update: Daily data sync" || true
          git push
