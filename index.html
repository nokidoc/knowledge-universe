<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Universe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #0a0a0a; color: #fff; }

        .container { display: flex; width: 100%; height: 100%; }
        .canvas { flex: 1; position: relative; background: linear-gradient(135deg, #0f0f0f, #1a1a1a); }
        .sidebar { width: 340px; background: #050505; border-left: 1px solid #1a1a1a; overflow-y: auto; padding: 20px; }

        .title { font-size: 20px; font-weight: 800; margin-bottom: 10px; background: linear-gradient(135deg, #fff, #aaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .stats { font-size: 11px; color: #666; margin-bottom: 20px; }

        .cluster-section { margin-bottom: 20px; }
        .cluster-header { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #555; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .cluster-count { color: #444; font-weight: 400; }

        .item { background: #111; border: 1px solid #1a1a1a; border-radius: 4px; padding: 9px; margin-bottom: 5px; cursor: pointer; transition: all 0.12s; font-size: 11px; }
        .item:hover { background: #151515; border-color: #222; transform: translateX(-2px); }
        .item-title { font-weight: 600; margin-bottom: 3px; line-height: 1.2; }
        .item-meta { color: #666; font-size: 9px; }

        .bubble { position: absolute; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 32px; text-shadow: 0 0 20px rgba(0,0,0,0.8); transition: all 0.2s; opacity: 0.85; }
        .bubble:hover { opacity: 1; transform: scale(1.12); }
        .bubble img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .modal { display: none; position: fixed; right: 0; top: 0; width: 400px; height: 100%; background: #050505; border-left: 1px solid #1a1a1a; padding: 25px; overflow-y: auto; z-index: 1000; }
        .modal.show { display: block; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #666; font-size: 28px; cursor: pointer; }
        .modal-close:hover { color: #fff; }

        .modal-img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; margin-bottom: 16px; border: 1px solid #1a1a1a; }
        .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; line-height: 1.3; }
        .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
        .badge { background: #111; border: 1px solid #1a1a1a; color: #888; padding: 4px 8px; border-radius: 3px; font-size: 9px; }

        .section { margin-bottom: 16px; }
        .section-title { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #555; margin-bottom: 6px; }
        .section-content { font-size: 11px; color: #999; line-height: 1.4; max-height: 120px; overflow-y: auto; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin: 14px 0; }
        .stat { background: #111; border: 1px solid #1a1a1a; padding: 8px; border-radius: 3px; text-align: center; }
        .stat-val { font-size: 13px; font-weight: 700; }
        .stat-lab { font-size: 8px; color: #666; margin-top: 2px; }

        .link { display: block; margin-top: 16px; padding-top: 16px; border-top: 1px solid #1a1a1a; color: #666; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .link:hover { color: #fff; }

        .controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 100; }
        .btn { background: #111; border: 1px solid #1a1a1a; color: #888; padding: 7px 14px; border-radius: 14px; cursor: pointer; font-size: 10px; font-weight: 600; transition: all 0.2s; }
        .btn:hover { background: #151515; border-color: #222; color: #fff; }

        .loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #666; }
        .spinner { width: 30px; height: 30px; border: 2px solid #222; border-top-color: #555; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb:hover { background: #222; }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading all 9700+ entries...</p>
    </div>

    <div class="container" id="container" style="display:none">
        <div class="canvas" id="canvas"></div>
        <div class="sidebar" id="sidebar">
            <div class="title">🧠 Knowledge Universe</div>
            <div class="stats" id="stats"></div>
            <div id="sidebar-content"></div>
        </div>
    </div>

    <div class="modal" id="modal">
        <button class="modal-close" id="modal-close">✕</button>
        <div id="modal-content"></div>
    </div>

    <div class="controls">
        <button class="btn" id="center-btn">⊙ Center</button>
        <button class="btn" id="reset-btn">↺ Reset</button>
    </div>

    <script>
        const CLUSTERS = { "Claude": "🤖", "ChatGPT": "💬", "Gemini": "✨", "Video-KI": "🎬" };
        let DATA = { byCluster: {}, total: 0 };
        let bubbles = [];
        let visibleBubbles = new Set();
        const MAX_BUBBLES = 200; // Render max 200 gleichzeitig

        async function loadData() {
            try {
                const res = await fetch('data.json');
                DATA = await res.json();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('container').style.display = 'flex';
                init();
            } catch (e) {
                console.error('Error loading data:', e);
                document.getElementById('loading').innerHTML = '<p>Error loading data</p>';
            }
        }

        class Bubble {
            constructor(x, y, data, isCluster = false) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 1.2;
                this.vy = (Math.random() - 0.5) * 1.2;
                this.data = data;
                this.isCluster = isCluster;
                this.radius = isCluster ? 65 : 28;
                this.el = null;
                this.visible = false;
            }

            update(cx, cy, all) {
                const dx = cx - this.x, dy = cy - this.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 100) {
                    this.vx += (dx / dist) * 0.007;
                    this.vy += (dy / dist) * 0.007;
                }

                all.forEach(other => {
                    if (other === this) return;
                    const ddx = this.x - other.x, ddy = this.y - other.y;
                    const ddist = Math.hypot(ddx, ddy);
                    const minDist = this.radius + other.radius + 12;
                    if (ddist < minDist) {
                        const f = (minDist - ddist) / minDist * 0.3;
                        this.vx += (ddx / ddist) * f;
                        this.vy += (ddy / ddist) * f;
                    }
                });

                this.vx *= 0.96; this.vy *= 0.96;
                this.x += this.vx; this.y += this.vy;

                const w = window.innerWidth * 0.7, h = window.innerHeight;
                if (this.x - this.radius < 0) this.vx = Math.abs(this.vx);
                if (this.x + this.radius > w) this.vx = -Math.abs(this.vx);
                if (this.y - this.radius < 0) this.vy = Math.abs(this.vy);
                if (this.y + this.radius > h) this.vy = -Math.abs(this.vy);
            }

            render() {
                const inViewport = this.x > -this.radius && this.x < window.innerWidth * 0.7 + this.radius &&
                                   this.y > -this.radius && this.y < window.innerHeight + this.radius;

                if (inViewport && visibleBubbles.size < MAX_BUBBLES) {
                    if (!this.visible) {
                        if (!this.el) this.createEl();
                        document.getElementById('canvas').appendChild(this.el);
                        visibleBubbles.add(this);
                        this.visible = true;
                    }
                    this.el.style.left = (this.x - this.radius) + 'px';
                    this.el.style.top = (this.y - this.radius) + 'px';
                } else if (this.visible) {
                    if (this.el) this.el.remove();
                    visibleBubbles.delete(this);
                    this.visible = false;
                }
            }

            createEl() {
                this.el = document.createElement('div');
                this.el.className = 'bubble';
                this.el.style.width = (this.radius * 2) + 'px';
                this.el.style.height = (this.radius * 2) + 'px';
                if (this.isCluster) {
                    this.el.textContent = CLUSTERS[this.data] || '?';
                } else {
                    const img = document.createElement('img');
                    img.src = this.data.bild_url || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22%3E%3Crect fill=%22%23222%22 width=%221%22 height=%221%22/%3E%3C/svg%3E';
                    this.el.appendChild(img);
                }
                this.el.onclick = () => this.isCluster ? showCluster(this.data) : showDetail(this.data);
            }
        }

        function init() {
            const cx = window.innerWidth * 0.35, cy = window.innerHeight / 2;
            bubbles = [];

            // Cluster bubbles
            Object.keys(CLUSTERS).forEach((name, i) => {
                const angle = (i / Object.keys(CLUSTERS).length) * Math.PI * 2;
                bubbles.push(new Bubble(cx + Math.cos(angle) * 180, cy + Math.sin(angle) * 180, name, true));
            });

            // Entry bubbles
            Object.entries(DATA.byCluster).forEach(([cluster, entries]) => {
                entries.slice(0, 400).forEach(e => { // Max 400 pro Cluster
                    const cBubble = bubbles.find(b => b.isCluster && b.data === cluster);
                    if (cBubble) {
                        const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 60;
                        bubbles.push(new Bubble(cBubble.x + Math.cos(a) * d, cBubble.y + Math.sin(a) * d, e, false));
                    }
                });
            });

            document.getElementById('stats').textContent = `${bubbles.length} bubbles • ${DATA.total} total entries`;
            renderSidebar();
            animate();
        }

        function animate() {
            const cx = window.innerWidth * 0.35, cy = window.innerHeight / 2;
            bubbles.forEach(b => b.update(cx, cy, bubbles));
            bubbles.forEach(b => b.render());
            requestAnimationFrame(animate);
        }

        function showDetail(entry) {
            document.getElementById('modal-content').innerHTML = `
                <img src="${entry.bild_url || ''}" class="modal-img" onerror="this.style.display='none'">
                <div class="modal-title">${entry.titel}</div>
                <div class="badges">
                    <span class="badge">📺 ${entry.plattform}</span>
                    <span class="badge">👤 ${entry.autor}</span>
                    <span class="badge">⭐ ${entry.relevanz}/10</span>
                </div>
                <div class="section">
                    <div class="section-title">Transkript</div>
                    <div class="section-content">${entry.transkript || '—'}</div>
                </div>
                <div class="section">
                    <div class="section-title">Summary</div>
                    <div class="section-content">${entry.zusammenfassung || '—'}</div>
                </div>
                <div class="stats-grid">
                    <div class="stat"><div class="stat-val">${(entry.views/1000).toFixed(0)}K</div><div class="stat-lab">Views</div></div>
                    <div class="stat"><div class="stat-val">${(entry.likes/1000).toFixed(1)}K</div><div class="stat-lab">Likes</div></div>
                    <div class="stat"><div class="stat-val">${entry.views > 0 ? (entry.likes/entry.views*100).toFixed(1) : 0}%</div><div class="stat-lab">Engage</div></div>
                </div>
                <a href="${entry.url}" target="_blank" class="link">→ Open Source</a>
            `;
            document.getElementById('modal').classList.add('show');
        }

        function showCluster(name) {
            const items = DATA.byCluster[name] || [];
            document.getElementById('modal-content').innerHTML = `
                <div class="modal-title">${CLUSTERS[name]} ${name}</div>
                <div class="section-content" style="margin-bottom:12px">${items.length} entries</div>
                ${items.slice(0, 15).map(e => `<div style="background:#111;border:1px solid #1a1a1a;padding:8px;border-radius:3px;margin-bottom:5px;cursor:pointer;font-size:10px" onclick="showDetail(this.data)" onmouseover="this.style.background='#151515'" onmouseout="this.style.background='#111'" data-entry='${JSON.stringify(e).replace(/'/g, "&#39;")}'><div style="font-weight:600;margin-bottom:2px">${e.titel.substring(0,50)}</div><div style="color:#666">⭐ ${e.relevanz} • ${e.datum}</div></div>`).join('')}
            `;
            document.getElementById('modal').classList.add('show');
        }

        function renderSidebar() {
            const content = document.getElementById('sidebar-content');
            content.innerHTML = '';
            Object.entries(DATA.byCluster).forEach(([name, items]) => {
                const div = document.createElement('div');
                div.className = 'cluster-section';
                div.innerHTML = `<div class="cluster-header"><span>${CLUSTERS[name]} ${name}</span><span class="cluster-count">${items.length}</span></div>` +
                    items.slice(0, 6).map((e, idx) => `<div class="item" onclick="showDetail(JSON.parse('${JSON.stringify(e).replace(/'/g, "&#39;")}'))"><div class="item-title">${e.titel.substring(0,38)}</div><div class="item-meta">⭐ ${e.relevanz} • ${e.datum}</div></div>`).join('');
                content.appendChild(div);
            });
        }

        document.getElementById('modal-close').onclick = () => document.getElementById('modal').classList.remove('show');
        document.getElementById('center-btn').onclick = () => bubbles.forEach(b => { b.vx = 0; b.vy = 0; });
        document.getElementById('reset-btn').onclick = () => location.reload();

        loadData();
    </script>
</body>
</html>
