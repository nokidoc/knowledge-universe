<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Universe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
        }

        .app { display: flex; width: 100%; height: 100%; }

        /* CANVAS AREA */
        .canvas {
            flex: 1;
            position: relative;
            background: linear-gradient(135deg, #111 0%, #1a1a1a 100%);
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 360px;
            background: #0f0f0f;
            border-left: 1px solid #222;
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #fff;
        }

        .cluster {
            margin-bottom: 28px;
        }

        .cluster-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #888;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cluster-icon {
            font-size: 18px;
        }

        .entry {
            background: #1a1a1a;
            border: 1px solid #222;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .entry:hover {
            background: #222;
            border-color: #333;
            transform: translateX(-4px);
        }

        .entry-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .entry-meta {
            font-size: 11px;
            color: #666;
            display: flex;
            gap: 10px;
        }

        /* BUBBLES */
        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: all 0.3s;
            border: 2px solid #333;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.05), transparent);
            backdrop-filter: blur(10px);
        }

        .bubble:hover {
            border-color: #555;
            box-shadow: 0 0 30px rgba(255,255,255,0.1);
            transform: scale(1.1);
        }

        .bubble img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .bubble-cluster {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .bubble-label {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 4px;
            text-align: center;
            border-radius: 0 0 50% 50%;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            right: 0;
            top: 0;
            width: 420px;
            height: 100%;
            background: #0f0f0f;
            border-left: 1px solid #222;
            padding: 30px;
            overflow-y: auto;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .modal.active { display: block; }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #1a1a1a;
            border: 1px solid #222;
            color: #888;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: #222;
            color: #fff;
        }

        .modal-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #222;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .modal-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .badge {
            background: #1a1a1a;
            border: 1px solid #222;
            color: #888;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .modal-section {
            margin-bottom: 24px;
        }

        .modal-section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #666;
            margin-bottom: 10px;
        }

        .modal-content {
            font-size: 13px;
            color: #999;
            line-height: 1.5;
            max-height: 200px;
            overflow-y: auto;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            background: #1a1a1a;
            border: 1px solid #222;
            color: #666;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag:hover {
            background: #222;
            color: #999;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .stat {
            background: #1a1a1a;
            border: 1px solid #222;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .stat-label {
            font-size: 10px;
            color: #666;
            margin-top: 4px;
        }

        .link {
            color: #888;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
            display: block;
            padding-top: 20px;
            border-top: 1px solid #222;
            transition: all 0.2s;
        }

        .link:hover {
            color: #fff;
        }

        /* CONTROLS */
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 500;
        }

        .btn {
            background: #1a1a1a;
            border: 1px solid #222;
            color: #888;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #222;
            color: #fff;
            border-color: #333;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #333; }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid #222;
            border-top-color: #555;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="canvas" id="canvas">
            <div class="loading">
                <div class="spinner"></div>
                <p>Lädt...</p>
            </div>
        </div>
        <div class="sidebar" id="sidebar"></div>
    </div>

    <div class="modal" id="modal">
        <button class="modal-close" id="modalClose">×</button>
        <div id="modalContent"></div>
    </div>

    <div class="controls">
        <button class="btn" id="centerBtn">⊙ Zentrieren</button>
        <button class="btn" id="resetBtn">↺ Reset</button>
    </div>

    <script>
        const DATA = {
            entries: [
                {datum: "4.6.2026", url: "https://vm.tiktok.com/ZGdHEYLb5/", plattform: "TikTok", autor: "Yourchatgptguide", titel: "ChatGPT: 7 Social Media Prompts", hashtags: ["ChatGPT", "Prompt-Eng", "Social-Media"], transkript: "STOP TELLING CHATGPT 'ACT LIKE A SOCIAL MEDIA EXPERT'. Bad Prompt = Bad Result. Here are 7 prompts: 1. Elite Manager 2. Audience Psychology 3. Viral Ideas 4. Hook Engineering 5. Algorithm Strategy 6. Repurposing 7. Advantage", zusammenfassung: "7 ChatGPT-Prompts für Social Media Management", bild_url: "https://drive.google.com/uc?id=1uviY12BHSFPlkBkQK8WMXqFb_IuBkXtV", relevanz: 9, views: 450000, likes: 32000, cluster: "ChatGPT"},
                {datum: "4.6.2026", url: "https://www.tiktok.com/@jgoldieseo/video/7647197420916428045", plattform: "TikTok", autor: "jgoldieseo", titel: "NotebookLM + Hermes: Free Content Factory", hashtags: ["NotebookLM", "Hermes", "Automation"], transkript: "Google NotebookLM + Hermes free AI content factory. Connect with MCP.", zusammenfassung: "Kostenlose AI für Content-Generierung", bild_url: "https://drive.google.com/uc?id=1xiCR4yPoBzJLWorxyzeBMIdtnvsHxETB", relevanz: 8, views: 280000, likes: 19000, cluster: "Gemini"},
                {datum: "4.6.2026", url: "https://www.tiktok.com/@jgoldieseo/video/7647198016293686541", plattform: "TikTok", autor: "jgoldieseo", titel: "Google Flow: AI Agent 3-in-1", hashtags: ["Google-Flow", "Gemini", "Content"], transkript: "Google Flow combines Gemini with project understanding.", zusammenfassung: "AI für Ideation und Content-Gen", bild_url: "https://drive.google.com/uc?id=1dDwsNgcK2qU4SttPR-N4XnhrpD2A0D7Y", relevanz: 8, views: 320000, likes: 24000, cluster: "Gemini"},
                {datum: "4.6.2026", url: "https://vm.tiktok.com/ZGdHSFqLY/", plattform: "TikTok", autor: "dawid_przybylski", titel: "Code Review Graph - 70% Token Savings", hashtags: ["Claude", "Code-Review", "Savings"], transkript: "Code Review Graph saves 70% tokens.", zusammenfassung: "Token-Einsparungen durch Code-Analyse", bild_url: "https://drive.google.com/uc?id=1ck1yS9O83dN9FVAR67NAI8i6Wq-7cnry", relevanz: 9, views: 560000, likes: 45000, cluster: "Claude"},
                {datum: "4.6.2026", url: "https://www.tiktok.com/@dawid_przybylski/video/7647231419630095648", plattform: "TikTok", autor: "dawid_przybylski", titel: "MarkItDown - PDF to Markdown", hashtags: ["PDF", "Markdown", "Claude"], transkript: "MarkItDown converts PDFs to clean markdown.", zusammenfassung: "PDF-zu-Markdown Konversion mit Token-Einsparung", bild_url: "https://drive.google.com/uc?id=1z4Wwx3jm1loHnhY05-_r_4fqM2I-jEGJ", relevanz: 8, views: 420000, likes: 38000, cluster: "Claude"},
                {datum: "4.6.2026", url: "https://www.tiktok.com/@dawid_przybylski/video/7647416667076660513", plattform: "TikTok", autor: "dawid_przybylski", titel: "Seedance: Porsche Video Prompt", hashtags: ["Seedance", "Video-KI", "Prompt"], transkript: "Seedance prompt for cinematic Porsche video.", zusammenfassung: "Video-KI Prompt-Engineering", bild_url: "https://drive.google.com/uc?id=1qVezO5uS02mosvQosOe7x2E5W6NEZ34O", relevanz: 7, views: 310000, likes: 22000, cluster: "Video-KI"}
            ]
        };

        const CLUSTERS = {"Claude": "🤖", "ChatGPT": "💬", "Gemini": "✨", "Video-KI": "🎬"};

        class Bubble {
            constructor(x, y, data, type = "entry") {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.data = data; this.type = type;
                this.element = null;
                this.radius = type === "cluster" ? 80 : 35;
            }

            update(centerX, centerY, bubbles) {
                const dx = centerX - this.x, dy = centerY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 100) {
                    this.vx += (dx / dist) * 0.01;
                    this.vy += (dy / dist) * 0.01;
                }
                bubbles.forEach(other => {
                    if (other === this) return;
                    const ddx = this.x - other.x, ddy = this.y - other.y;
                    const ddist = Math.sqrt(ddx * ddx + ddy * ddy);
                    const minDist = this.radius + other.radius + 20;
                    if (ddist < minDist) {
                        const force = (minDist - ddist) / minDist * 0.5;
                        this.vx += (ddx / ddist) * force;
                        this.vy += (ddy / ddist) * force;
                    }
                });
                this.vx *= 0.98; this.vy *= 0.98;
                this.x += this.vx; this.y += this.vy;
                if (this.x - this.radius < 0) this.vx = Math.abs(this.vx);
                if (this.x + this.radius > window.innerWidth * 0.73) this.vx = -Math.abs(this.vx);
                if (this.y - this.radius < 0) this.vy = Math.abs(this.vy);
                if (this.y + this.radius > window.innerHeight) this.vy = -Math.abs(this.vy);
            }

            render() {
                if (!this.element) {
                    this.element = document.createElement('div');
                    this.element.className = 'bubble';
                    this.element.style.width = (this.radius * 2) + 'px';
                    this.element.style.height = (this.radius * 2) + 'px';
                    if (this.type === "cluster") {
                        this.element.innerHTML = `<div class="bubble-cluster">${CLUSTERS[this.data]}</div>`;
                    } else {
                        this.element.innerHTML = `<img src="${this.data.bild_url}">`;
                    }
                    this.element.onclick = () => this.type === "cluster" ? showClusterDetail(this.data) : showDetail(this.data);
                    document.getElementById('canvas').appendChild(this.element);
                }
                this.element.style.left = (this.x - this.radius) + 'px';
                this.element.style.top = (this.y - this.radius) + 'px';
            }
        }

        let bubbles = [];

        function initUniverse() {
            const canvas = document.getElementById('canvas');
            const centerX = canvas.offsetWidth / 2;
            const centerY = canvas.offsetHeight / 2;
            Object.keys(CLUSTERS).forEach((cluster, i) => {
                const angle = (i / Object.keys(CLUSTERS).length) * Math.PI * 2;
                const x = centerX + Math.cos(angle) * 250;
                const y = centerY + Math.sin(angle) * 250;
                bubbles.push(new Bubble(x, y, cluster, "cluster"));
            });
            DATA.entries.forEach(entry => {
                const clusterBubble = bubbles.find(b => b.type === "cluster" && b.data === entry.cluster);
                if (clusterBubble) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 100 + Math.random() * 60;
                    bubbles.push(new Bubble(clusterBubble.x + Math.cos(angle) * dist, clusterBubble.y + Math.sin(angle) * dist, entry, "entry"));
                }
            });
            animate();
        }

        function animate() {
            const canvas = document.getElementById('canvas');
            const centerX = canvas.offsetWidth / 2;
            const centerY = canvas.offsetHeight / 2;
            bubbles.forEach(bubble => bubble.update(centerX, centerY, bubbles));
            bubbles.forEach(bubble => bubble.render());
            requestAnimationFrame(animate);
        }

        function showDetail(entry) {
            document.getElementById('modalContent').innerHTML = `
                <img src="${entry.bild_url}" class="modal-image">
                <h2 class="modal-title">${entry.titel}</h2>
                <div class="modal-badges">
                    <span class="badge">📺 ${entry.plattform}</span>
                    <span class="badge">👤 ${entry.autor}</span>
                    <span class="badge">📅 ${entry.datum}</span>
                    <span class="badge">⭐ ${entry.relevanz}/10</span>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">Transkript</div>
                    <div class="modal-content">${entry.transkript}</div>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">Zusammenfassung</div>
                    <div class="modal-content">${entry.zusammenfassung}</div>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">Tags</div>
                    <div class="tags">${entry.hashtags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
                </div>
                <div class="stats">
                    <div class="stat"><div class="stat-value">${(entry.views / 1000).toFixed(0)}K</div><div class="stat-label">Views</div></div>
                    <div class="stat"><div class="stat-value">${(entry.likes / 1000).toFixed(1)}K</div><div class="stat-label">Likes</div></div>
                    <div class="stat"><div class="stat-value">${(entry.likes / entry.views * 100).toFixed(1)}%</div><div class="stat-label">Engagement</div></div>
                </div>
                <a href="${entry.url}" target="_blank" class="link">→ Zur Quelle</a>
            `;
            document.getElementById('modal').classList.add('active');
        }

        function showClusterDetail(clusterName) {
            const items = DATA.entries.filter(e => e.cluster === clusterName);
            document.getElementById('modalContent').innerHTML = `
                <h2 class="modal-title">${CLUSTERS[clusterName]} ${clusterName}</h2>
                <p style="color:#666;margin-bottom:20px">${items.length} Einträge</p>
                ${items.map((entry, idx) => `<div style="background:#1a1a1a;border:1px solid #222;padding:12px;border-radius:4px;margin-bottom:10px;cursor:pointer;transition:all 0.2s" onmouseover="this.style.background='#222'" onmouseout="this.style.background='#1a1a1a'" onclick="showDetail(DATA.entries[${DATA.entries.indexOf(entry)}])"><div style="font-weight:600;margin-bottom:6px">${entry.titel}</div><div style="font-size:11px;color:#666">⭐ ${entry.relevanz}/10 • ${entry.datum}</div></div>`).join('')}
            `;
            document.getElementById('modal').classList.add('active');
        }

        document.getElementById('modalClose').onclick = () => document.getElementById('modal').classList.remove('active');
        document.getElementById('centerBtn').onclick = () => bubbles.forEach(b => {b.vx = 0; b.vy = 0;});
        document.getElementById('resetBtn').onclick = () => location.reload();

        const sidebar = document.getElementById('sidebar');
        sidebar.innerHTML = '<div class="sidebar-header">Knowledge Universe</div>';
        Object.entries(CLUSTERS).forEach(([name, icon]) => {
            const items = DATA.entries.filter(e => e.cluster === name);
            if (items.length === 0) return;
            const cluster = document.createElement('div');
            cluster.className = 'cluster';
            cluster.innerHTML = `<div class="cluster-title"><span class="cluster-icon">${icon}</span>${name}</div>` +
                items.map(item => `<div class="entry" onclick="showDetail(DATA.entries[${DATA.entries.indexOf(item)}])"><div class="entry-title">${item.titel}</div><div class="entry-meta"><span>⭐ ${item.relevanz}</span><span>${item.datum}</span></div></div>`).join('');
            sidebar.appendChild(cluster);
        });

        initUniverse();
    </script>
</body>
</html>
